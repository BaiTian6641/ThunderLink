[package]
name = "thunderlink-desktop"
version = "0.1.0"
description = "ThunderLink desktop app (target + initiator roles)"
edition = "2021"
license = "MIT OR Apache-2.0"

# Separate workspace: keep the tauri dependency tree out of the core
# workspace's lockfile and `cargo test --workspace`.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core-foundation-sys = "0.8"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
thunderlink-engine = { path = "../../../crates/thunderlink-engine" }
tl-net = { path = "../../../crates/tl-net" }
tl-proto = { path = "../../../crates/tl-proto" }

[profile.release]
debug = true
lto = "thin"
